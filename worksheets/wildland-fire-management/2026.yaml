badge:
  name: Wildland Fire Management
  slug: wildland-fire-management
  requirements_revision: "2026-07-22"
  description: >
    Wildland Fire Management looks at fire as both a destructive force and a
    natural part of healthy ecosystems. You will study how wildfires start and
    spread, how they are prevented, fought, and used as a management tool, and
    how communities can become more fire-resilient, along with the careers that
    make this work possible.

requirements:
  - id: "1"
    prompt: >
      History of Wildland Fire. Research and discuss with your counselor the
      history of wildland fire, its suppression, prevention, and management in
      the United States.
    field: { type: text_box, lines: 8 }

  - id: "2"
    intro: >
      Harms of Wildfire. Research the harm caused by wildfire in the United
      States, including annual acres burned for the past three years. Discuss
      with your counselor. Include the negative impacts that wildfire has on the
      following:
    children:
      - id: "2-acres"
        prompt: "Annual acres burned in the United States for the past three years."
        field:
          type: table
          headers: ["Year", "Acres burned", "Notes / source"]
          rows: 3
          cols: 3
      - id: "2-impacts"
        prompt: "Negative impacts of wildfire on each of the following:"
        field:
          type: labeled_rows
          lines_each: 2
          labels:
            - "Commercial forest products"
            - "Fish and wildlife habitat"
            - "Soil and water"
            - "Recreation and public use"
            - "Homes, communities, and human resources"
            - "Air quality and public health"

  - id: "3"
    intro: >
      Fire as a Management Tool. Discuss with your counselor how prescribed fire
      is used to accomplish the following:
    children:
      - id: "3-uses"
        prompt: "How prescribed fire is used for each of the following:"
        field:
          type: labeled_rows
          lines_each: 2
          labels:
            - "Fuel reduction"
            - "Fish and wildlife habitat enhancement"
            - "Ecosystem restoration"
            - "Forest regeneration"
            - "Insect and disease control"

  - id: "4"
    intro: "Wildfire Prevention and Mitigation. Discuss the following with your counselor:"
    children:
      - id: "4a"
        prompt: "Wildfire Prevention:"
        field:
          type: labeled_rows
          lines_each: 3
          labels:
            - "The main causes of wildfire in the United States"
            - "How you can prevent human caused wildfires in your community and on outings with your unit"
      - id: "4b"
        prompt: "Wildfire Mitigation:"
        field:
          type: labeled_rows
          lines_each: 3
          labels:
            - "Wildland-Urban Interface"
            - "Defensible space and how homes and communities in the wildland-urban interface can be protected from wildfire"

  - id: "5"
    intro: "Fire Behavior. Do the following:"
    children:
      - id: "5a"
        prompt: >
          Discuss with your counselor how the fire environment affects wildland
          fire behavior. Include examples of the influences of weather,
          topography, and fuel.
        field: { type: text_box, lines: 8 }
      - id: "5b"
        prompt: "Explain how a wildfire can be suppressed by removing heat, fuel, or oxygen."
        field: { type: text_box, lines: 6 }
      - id: "5c"
        prompt: "Draw a diagram to illustrate the parts of a wildfire."
        field: { type: draw_area, height: 4.5 }

  - id: "6"
    intro: "Wildland Firefighter Safety. Do the following:"
    children:
      - id: "6a"
        prompt: >
          Discuss with your counselor the personal protective equipment used by
          wildland firefighters and its use.
        field: { type: text_box, lines: 6 }
      - id: "6b"
        prompt: >
          Discuss the following with your counselor, including why each is an
          important consideration for maintaining personal safety and
          situational awareness during wildland fire suppression activities:
        field:
          type: labeled_rows
          lines_each: 3
          labels:
            - "10 Standard Firefighting Orders"
            - "18 Watch Out Situations"
            - "Lookouts, Communication, Escape Routes, and Safety Zones (LCES)"

  - id: "7"
    intro: "Wildfire Suppression Tactics. Do the following:"
    children:
      - id: "7a"
        prompt: >
          Alone or with a small team, using the diagram you created in
          Requirement 5(c) or a map of a wildfire, and tokens to represent
          firefighting resources, demonstrate the following wildland fire
          suppression tactics. Explain under which conditions each tactic would
          be used:
        field:
          type: labeled_rows
          lines_each: 2
          labels:
            - "Direct attack"
            - "Indirect attack"
            - "Minimum impact suppression tactics"
            - "Use of hand crews, machinery, and aircraft"
            - "Mop-up"
            - "Repair and restoration"
      - id: "7b"
        prompt: "Draw a diagram of the Incident Command System."
        field: { type: draw_area, height: 4.5 }
      - id: "7b-staff"
        prompt: >
          Alone or with your team, explain the responsibilities of the Command
          and General Staff positions on a wildfire incident.
        field: { type: text_box, lines: 8 }

  - id: "8"
    intro: "Wildfire Suppression Tools. Do the following:"
    children:
      - id: "8a"
        prompt: >
          Demonstrate the use of three hand tools unique to wildland fire
          suppression. Use one of these tools to demonstrate how to construct a
          fireline.
        field:
          type: repeated_block
          count: 3
          template:
            - { label: "Hand tool", type: text_field }
            - { label: "How it is used", type: text_box, lines: 2 }
      - id: "8a-fireline"
        prompt: "Note which tool you used to construct a fireline and how you did it."
        field: { type: text_box, lines: 3 }
      - id: "8b"
        prompt: >
          Discuss seven other tools, equipment, or apparatus that are unique to
          wildland fire suppression and explain how these resources are used.
        field:
          type: repeated_block
          count: 7
          template:
            - { label: "Tool / equipment / apparatus", type: text_field }
            - { label: "How it is used", type: text_box, lines: 2 }

  - id: "9"
    intro: "Taking Action. Do ONE of the following:"
    field:
      type: checklist
      items:
        - "Develop a fire readiness plan for a wildland area with which you are familiar. The plan should include a map showing available resources, water supplies, natural and manmade barriers, and access. The plan should discuss fuel loads, available fire apparatus, structure protection needs, values at risk, medical and evacuation considerations and potential fire suppression tactics."
        - "Visit with a state or federal forestry official or your local fire warden. Discuss the causes of and types of wildland fire that occur in your area. Discuss the prime fire season(s) in your area. Identify the agency responsible for wildland fire suppression in your area. Discuss what you learned with your counselor."
        - "Conduct a Firewise assessment of a home or a building in the wildland-urban interface, which could include a Scout camp building or facility. Identify potential risks and fire hazards. With your counselor's approval, complete a project to reduce the wildfire risk and increase the preparedness of the building. Write a brief report about what you did and learned from the assessment and project."
        - "Meet with a Fire Prevention Specialist or a local fire official to learn about fire prevention efforts in your community. From what you learned, prepare a fire prevention message (skit, video, or billboard concept) and share with your counselor and troop (or other group approved by your counselor)."
        - "Meet with a meteorologist or someone familiar with fire weather and discuss the fire weather concerns and typical fire seasons that exist in your area. Discuss the conditions that lead to a Fire Weather Watch or a Red Flag Warning. Discuss what you learned with your counselor."
    children:
      - id: "9-notes"
        prompt: "Notes, plan, or report for your chosen option"
        field: { type: text_box, lines: 12 }

  - id: "10"
    prompt: >
      Apply Your Learning to a Real Event. Research an historic catastrophic
      wildland fire incident that occurred in the United States. Discuss with
      your counselor and/or your troop or a group approved by your counselor the
      conditions that led to the incident, how the incident was managed, and how
      the incident could have been prevented. Explain what lessons were learned
      and how this incident affected future fire suppression policy or
      suppression tactics.
    field: { type: text_box, lines: 12 }

  - id: "11"
    prompt: >
      Careers in Wildland Fire Management. Explore careers related to this merit
      badge. Research one career to learn about the training and education
      needed, costs, job prospects, salary, job duties, and career advancement.
      Your research methods may include, with your parent or guardian's
      permission, an internet or library search, an interview with a
      professional in the field, or a visit to a location where people in this
      career work. Discuss with your counselor both your findings and what about
      this profession might make it an interesting career.
    field: { type: text_box, lines: 12 }
